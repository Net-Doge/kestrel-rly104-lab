# RTU VM — the protected asset, behind a firewall.
#
#   docker compose -f deploy/docker-compose.rtu.yml up -d
#
# Publishes IEC-104 and the HMI so the JUMP BOX can reach them. The firewall in
# front of this VM is expected to permit only the jump box; see deploy/README.md
# for the flows to allow.
#
# Bind to the internal NIC so the ports are not offered on a public interface:
#   RTU_BIND=10.20.30.5 docker compose -f deploy/docker-compose.rtu.yml up -d

services:
  rtu:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kestrel-rly104:latest
    container_name: kestrel-rtu
    hostname: rly104
    restart: unless-stopped
    ports:
      # 0.0.0.0 by default so the other machine can connect. Bind to a specific
      # interface with e.g.  RTU_BIND=10.20.30.5
      - "${RTU_BIND:-0.0.0.0}:${IEC_PORT:-2404}:2404"
      - "${RTU_BIND:-0.0.0.0}:${HMI_PORT:-8080}:8080"
    environment:
      KESTREL_TRIP_ACTION: "${KESTREL_TRIP_ACTION:-ACTION REQUIRED: inspect P-43 transfer pump immediately - shaft and coupling may be damaged, do not restart before check}"
      KESTREL_EXTRA_ARGS: "${KESTREL_EXTRA_ARGS:--v}"
    cap_add:
      - NET_RAW
    labels:
      ot.role: "rtu"
      ot.zone: "protected-ot"
      ot.vendor: "Kestrel Controls"
      ot.model: "RLY-104 Feeder Guard"
      ot.protocol: "iec-60870-5-104"
      ot.common_address: "17"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status.json', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 3
