# One command:   docker compose up -d
#
#   rtu      Kestrel RLY-104 - IEC 60870-5-104 on 2404, HMI on 8080
#   console  Kestrel engineering console - browser shell on 8081
#
# Two separate containers sharing an OT bridge, each with a fixed address and a
# hostname, so the segment can be scanned and browsed the way a real one would
# be. The console has no idea where the RTU is until someone types its address
# in - finding it is part of the exercise.

services:
  rtu:
    build: .
    image: kestrel-rly104:latest
    container_name: kestrel-rtu
    hostname: rly104
    restart: unless-stopped
    ports:
      # host:container - change the host side freely; the container side is
      # fixed so 2404 stays the registered IEC-104 port inside the network.
      - "${IEC_PORT:-2404}:2404"
      - "${HMI_PORT:-8080}:8080"
    environment:
      # Operator instruction raised in the CRIT alarm when the feeder trips.
      # Override per exercise if you want a site-specific procedure reference.
      KESTREL_TRIP_ACTION: "${KESTREL_TRIP_ACTION:-ACTION REQUIRED: inspect P-43 transfer pump immediately - shaft and coupling may be damaged, do not restart before check}"
      # --seed N fixes the per-boot sync angle for reproducible runs;
      # -v logs every handoff and command to the container's stdout.
      KESTREL_EXTRA_ARGS: "${KESTREL_EXTRA_ARGS:--v}"
    networks:
      ot:
        # Stable address for range scenarios: point your SCADA master or
        # detection stack at 10.104.0.10:2404 regardless of host port mapping.
        ipv4_address: 10.104.0.10
    # An RTU is a network device; let it be pinged and traced like one.
    cap_add:
      - NET_RAW        # tcpdump inside the container
    labels:
      ot.role: "rtu"
      ot.vendor: "Kestrel Controls"
      ot.model: "RLY-104 Feeder Guard"
      ot.protocol: "iec-60870-5-104"
      ot.common_address: "17"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status.json', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 3

  console:
    build: .
    image: kestrel-rly104:latest
    container_name: kestrel-console
    hostname: eng-console
    restart: unless-stopped
    entrypoint: ["python3", "/opt/kestrel/console/console.py",
                 "--listen", "0.0.0.0", "--port", "8081"]
    ports:
      - "${CONSOLE_PORT:-8081}:8081"
    environment:
      # Leave EMPTY so the operator has to discover the RTU. Set them to
      # prefill the connection form for a guided exercise, e.g.
      #   CONSOLE_SUGGEST_HOST=10.104.0.10  CONSOLE_SUGGEST_HMI=8080
      CONSOLE_SUGGEST_HOST: "${CONSOLE_SUGGEST_HOST:-}"
      CONSOLE_SUGGEST_PORT: "${CONSOLE_SUGGEST_PORT:-2404}"
      CONSOLE_SUGGEST_HMI: "${CONSOLE_SUGGEST_HMI:-}"
    networks:
      ot:
        ipv4_address: 10.104.0.30
    cap_add:
      - NET_RAW
    labels:
      ot.role: "engineering-console"
      ot.protocol: "http"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/banner', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 3

  # Optional attacker box with the client tooling and nmap, on the same OT
  # network. Not started by default:   docker compose up -d attacker
  attacker:
    build: .
    image: kestrel-rly104:latest
    container_name: kestrel-attacker
    hostname: engineering-ws
    profiles: ["attacker"]
    depends_on:
      rtu:
        condition: service_healthy
    entrypoint: ["sleep", "infinity"]
    networks:
      ot:
        ipv4_address: 10.104.0.20
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # It runs `sleep infinity`, so the image's HMI healthcheck would always fail.
    healthcheck:
      disable: true

networks:
  ot:
    name: kestrel-ot
    driver: bridge
    ipam:
      config:
        - subnet: 10.104.0.0/24
          gateway: 10.104.0.1
    driver_opts:
      com.docker.network.bridge.name: br-kestrel
